<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Saturninas — Próximamente</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-deep: #12161c;
        --bg-mid: #1a222c;
        --teal: #2ec4b6;
        --teal-dim: rgba(46, 196, 182, 0.22);
        --text: #f0f4f3;
        --text-soft: #9fb5b0;
        --radius: 12px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2.25rem;
        padding: clamp(1.25rem, 4vw, 2.5rem);
        font-family: "DM Sans", system-ui, -apple-system, sans-serif;
        color: var(--text);
        background: radial-gradient(
            ellipse 80% 60% at 50% 0%,
            var(--teal-dim) 0%,
            transparent 55%
          ),
          linear-gradient(165deg, var(--bg-mid) 0%, var(--bg-deep) 100%);
      }
      .wrap {
        width: min(100%, 56rem);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2rem;
      }
      .hero-img {
        position: relative;
        width: 100%;
        /* Big hero band: most of the viewport, capped on very large screens */
        height: clamp(16rem, 75dvh, 48rem);
        border-radius: var(--radius);
        overflow: hidden;
        /* Soft outer shadow that fades into the background */
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4),
          0 0 80px rgba(46, 196, 182, 0.08);
        /* Feathered mask for smooth edge blending */
        -webkit-mask-image: radial-gradient(
          ellipse 90% 90% at 50% 50%,
          black 70%,
          transparent 100%
        );
        mask-image: radial-gradient(
          ellipse 90% 90% at 50% 50%,
          black 70%,
          transparent 100%
        );
      }
      .hero-img::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        /* Soft vignette that blends edges with background */
        background: radial-gradient(
            ellipse 80% 80% at 50% 50%,
            transparent 40%,
            rgba(18, 22, 28, 0.4) 100%
          ),
          linear-gradient(
            to top,
            var(--bg-mid) 0%,
            transparent 60%
          ),
          linear-gradient(
            135deg,
            rgba(46, 196, 182, 0.12) 0%,
            transparent 70%
          );
        pointer-events: none;
        z-index: 1;
      }
      .hero-img::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        /* Soft inner glow instead of hard border */
        box-shadow: inset 0 0 60px rgba(18, 22, 28, 0.5),
          inset 0 0 0 1px rgba(255, 255, 255, 0.06);
        pointer-events: none;
        z-index: 2;
      }
      .hero-img img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 30%;
        display: block;
        position: relative;
        z-index: 0;
        /* Slight scale for smoother edge blending */
        transform: scale(1.02);
        /* Smooth transition on load */
        transition: transform 0.6s ease;
      }
      /* Subtle zoom on hover for depth */
      .hero-img:hover img {
        transform: scale(1.05);
      }
      /* Focus on right side of image on mobile */
      @media (max-width: 640px) {
        .hero-img img {
          object-position: 65% center;
        }
      }
      .headline {
        text-align: center;
        max-width: 22rem;
      }
      .brand {
        margin: 0 0 0.35rem;
        font-size: clamp(1.75rem, 5vw, 2.15rem);
        font-weight: 700;
        letter-spacing: 0.04em;
        line-height: 1.1;
        background: linear-gradient(120deg, #fff 0%, #c8e8e2 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .tag {
        display: block;
        margin: 0 0 0.5rem;
        font-size: clamp(1.05rem, 2.8vw, 1.2rem);
        font-weight: 500;
        font-style: normal;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--teal);
      }
      .sub {
        margin: 0;
        font-size: 0.95rem;
        font-weight: 400;
        color: var(--text-soft);
        line-height: 1.5;
      }
      .sub::before {
        content: "";
        display: block;
        width: 2.5rem;
        height: 2px;
        margin: 0 auto 0.75rem;
        background: linear-gradient(90deg, transparent, var(--teal), transparent);
        border-radius: 1px;
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="hero-img">
        <img
          src="woman-health.png"
          alt="Mujer mayor entrenando en un gimnasio, salud y bienestar"
        />
      </div>
      <header class="headline">
        <span class="tag">Próximamente</span>
        <h1 class="brand">Saturninas</h1>
        <p class="sub">En construcción.</p>
      </header>
    </div>
  </body>
</html>
